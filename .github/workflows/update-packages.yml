# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: false
  group: nix-updates
jobs:
  update:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - env:
          UPDATE_EXCLUDE: shoko shoko-webui shoko-plugin-anilist shoko-plugin-tmdb shoko-plugin-offlineimporter shoko-plugin-webaom
        name: Update packages
        run: scripts/update-packages.sh
      - if: always()
        name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          body: |-
            ## Updated packages

            ${{ env.UPDATED_PACKAGES }}
          branch: update-packages
          delete-branch: true
          labels: automerge
          title: Update packages
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
  update-shoko:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@main
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - env:
          UPDATE_ONLY: shoko shoko-webui shoko-plugin-anilist shoko-plugin-tmdb shoko-plugin-offlineimporter shoko-plugin-webaom
        name: Update packages
        run: scripts/update-packages.sh
      - if: always()
        name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          body: |-
            ## Updated packages

            ${{ env.UPDATED_PACKAGES }}
          branch: update-shoko
          delete-branch: true
          title: Update Shoko
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
name: Update packages
"on":
  schedule:
    - cron: 0 21 * * *
  workflow_dispatch: {}
